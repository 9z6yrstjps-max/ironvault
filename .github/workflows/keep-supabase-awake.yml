# Supabase pauses Free projects that see too little database activity over a week.
# This reads the public vault list (the same read every visitor does) every three days.
# The key is the publishable one already in config.js; nothing secret is used.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: config.js
          sparse-checkout-cone-mode: false
      - name: Read the vault list
        run: |
          url=$(grep -o 'https://[a-z0-9]*\.supabase\.co' config.js | head -1)
          key=$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' config.js | head -1)
          test -n "$url" && test -n "$key"
          for i in 1 2 3; do
            code=$(curl -s -o body.json -w '%{http_code}' -m 30 \
              "$url/rest/v1/vaults?select=character&limit=1" -H "apikey: $key" -H "Authorization: Bearer $key")
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then cat body.json; echo; exit 0; fi
            sleep 20
          done
          echo "::error::Supabase did not answer. If the project is paused, resume it from the Supabase dashboard."
          exit 1
